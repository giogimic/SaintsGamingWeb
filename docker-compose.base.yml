version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: saints-gaming-web
    container_name: saints-gaming-web
    restart: unless-stopped
    ports:
      - "24001:24001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Map the SQLite DB file so it persists across container restarts
      - ./data:/app/prisma/db
      # Map the uploads directory so user images persist
      - ./uploads:/app/public/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - DB_SKIP_MIGRATION=${DB_SKIP_MIGRATION:-false}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - AUTH_URL=${NEXT_PUBLIC_SITE_URL}/api/auth
      - NEXTAUTH_URL=${NEXT_PUBLIC_SITE_URL}/api/auth
      - NEXT_PUBLIC_DISCORD_INVITE=${NEXT_PUBLIC_DISCORD_INVITE}
      - GO_MMO_INTERNAL_URL=${GO_MMO_INTERNAL_URL:-http://game-server:24011}
      - GO_MMO_ADMIN_SECRET=${GO_MMO_ADMIN_SECRET:-${AUTH_SECRET}}

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:24001/" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - default
      - saints_network

  game-server:
    build:
      context: ./the-lobby
      dockerfile: Dockerfile
    image: saints-gaming-mmo-go
    container_name: saints-gaming-mmo-go
    restart: unless-stopped
    ports:
      - "24011:24011"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - GO_MMO_DATABASE_URL=file:/app/data/dev.db
      - NEXT_JS_URL=http://web:24001
      - GO_MMO_ADMIN_SECRET=${AUTH_SECRET}

networks:
  saints_network:
    driver: bridge
