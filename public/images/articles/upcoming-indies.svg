<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-indie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18042b" />
      <stop offset="50%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#4a0e4e" />
    </linearGradient>
    <linearGradient id="indie-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg-indie)" rx="16" />
  
  <!-- Glowing Diamond / Indie Crystal Core -->
  <polygon points="400,90 460,170 400,250 340,170" fill="url(#indie-gem)" stroke="#ffffff" stroke-width="2" />
  <polygon points="400,90 400,250 340,170" fill="#f43f5e" opacity="0.6" />
  <polygon points="400,90 460,170 400,250" fill="#fbbf24" opacity="0.6" />

  <!-- Orbiting Pixel Stars -->
  <rect x="250" y="140" width="16" height="16" fill="#38bdf8" transform="rotate(45 258 148)" />
  <rect x="534" y="140" width="16" height="16" fill="#a855f7" transform="rotate(45 542 148)" />
  <rect x="290" y="220" width="12" height="12" fill="#34d399" transform="rotate(45 296 226)" />
  <rect x="498" y="220" width="12" height="12" fill="#f43f5e" transform="rotate(45 504 226)" />

  <!-- Retro Sparklines -->
  <circle cx="400" cy="170" r="85" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5" />
  
  <text x="400" y="345" fill="white" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="2">UPCOMING INDIE SPOTLIGHT</text>
</svg>
