<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" fill="none">
  <defs>
    <filter id="sg-fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Left Side: White Pixels with Black Outlines -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter">
    <rect x="132" y="25" width="12" height="12" />
    <rect x="116" y="37" width="16" height="12" />
    <rect x="100" y="49" width="16" height="12" />
    <rect x="84" y="61" width="16" height="12" />
    <rect x="68" y="73" width="16" height="12" />
    <rect x="56" y="85" width="12" height="90" />
    <rect x="68" y="175" width="16" height="12" />
    <rect x="84" y="187" width="16" height="12" />
    <rect x="100" y="199" width="16" height="12" />
    <rect x="116" y="211" width="16" height="12" />
    <rect x="132" y="223" width="12" height="12" />
  </g>

  <!-- Right Side: Hot Pink Pixels with Black Outlines -->
  <g fill="#E6007E" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter">
    <rect x="156" y="25" width="12" height="12" />
    <rect x="168" y="37" width="16" height="12" />
    <rect x="184" y="49" width="16" height="12" />
    <rect x="200" y="61" width="16" height="12" />
    <rect x="216" y="73" width="16" height="12" />
    <rect x="232" y="85" width="12" height="90" />
    <rect x="216" y="175" width="16" height="12" />
    <rect x="200" y="187" width="16" height="12" />
    <rect x="184" y="199" width="16" height="12" />
    <rect x="168" y="211" width="16" height="12" />
    <rect x="156" y="223" width="12" height="12" />
  </g>

  <!-- Center Apex Dividers: Solid Black -->
  <g fill="#000000" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter">
    <rect x="144" y="25" width="12" height="12" />
    <rect x="144" y="223" width="12" height="12" />
  </g>

  <!-- Inner Monogram Letters -->
  <g filter="url(#sg-fav-shadow)">
    <!-- Letter S (Pure White) -->
    <path
      d="M 86 100 H 134 V 114 H 102 V 124 H 134 V 162 H 86 V 148 H 118 V 138 H 86 Z"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="3.5"
      stroke-linejoin="miter"
      stroke-linecap="square"
    />

    <!-- Letter G (Pure White) -->
    <path
      d="M 166 100 H 214 V 114 H 182 V 148 H 200 V 141 H 189 V 127 H 214 V 162 H 166 Z"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="3.5"
      stroke-linejoin="miter"
      stroke-linecap="square"
    />
  </g>
</svg>
